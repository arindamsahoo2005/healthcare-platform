<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head}">
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">
    <!-- Header & Navigation -->
    <div th:replace="~{layout/main :: header}"></div>
    <div th:replace="~{layout/main :: nav}"></div>

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="max-w-lg w-full bg-white rounded-3xl shadow-xl border border-slate-200 p-7 sm:p-9 relative">
            
            <!-- Logo & Brand Header -->
            <div class="text-center mb-6">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-600 to-teal-500 text-white flex items-center justify-center mx-auto mb-3 text-2xl shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-user-plus"></i>
                </div>
                <h1 class="text-2xl font-black text-slate-900 tracking-tight">Create CarePulse Account</h1>
                <p class="text-xs text-slate-500 mt-1">Join the connected digital healthcare platform for instant triage & medical records</p>
            </div>

            <!-- Inline Alert Box -->
            <div id="page-reg-alert" class="hidden mb-4 p-3 rounded-xl text-xs font-semibold flex items-center gap-2"></div>

            <!-- 1. Google 1-Click Sign-In -->
            <div class="mb-5">
                <button type="button" onclick="signInWithGoogle()" class="w-full flex items-center justify-center gap-3 bg-white hover:bg-slate-50 text-slate-700 font-bold py-3 px-4 rounded-2xl border border-slate-300 shadow-sm transition hover:border-slate-400 cursor-pointer text-sm">
                    <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Sign up with Google (1-Click)</span>
                </button>
            </div>

            <!-- Divider -->
            <div class="relative flex py-1 items-center mb-5">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink mx-3 text-[10px] font-bold uppercase tracking-wider text-slate-400">or register with your details</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <!-- Register Form -->
            <form id="page-reg-form" onsubmit="handlePageRegister(event)" class="space-y-4 text-xs">
                <div>
                    <label class="block font-bold text-slate-700 uppercase mb-1.5">Full Name *</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
                        <input type="text" id="page-reg-fullname" required placeholder="e.g. Rahul Sharma" class="w-full pl-10 pr-3 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-xs sm:text-sm">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block font-bold text-slate-700 uppercase mb-1.5">Email Address *</label>
                        <div class="relative">
                            <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
                            <input type="email" id="page-reg-email" required placeholder="name@example.com" class="w-full pl-10 pr-3 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-xs sm:text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 uppercase mb-1.5">Phone Number (Optional)</label>
                        <div class="relative">
                            <i class="fa-solid fa-phone absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
                            <input type="tel" id="page-reg-phone" placeholder="+91 98765 43210" class="w-full pl-10 pr-3 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-xs sm:text-sm">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block font-bold text-slate-700 uppercase mb-1.5">Primary Healthcare City</label>
                    <div class="relative">
                        <i class="fa-solid fa-location-dot absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
                        <select id="page-reg-city" class="w-full pl-10 pr-3 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-xs sm:text-sm bg-white text-slate-800">
                            <option value="Kolkata">Kolkata (West Bengal)</option>
                            <option value="Delhi">Delhi &amp; NCR</option>
                            <option value="Mumbai">Mumbai (Maharashtra)</option>
                            <option value="Bengaluru">Bengaluru (Karnataka)</option>
                            <option value="Bhubaneswar">Bhubaneswar (Odisha)</option>
                            <option value="Chennai">Chennai (Tamil Nadu)</option>
                            <option value="Hyderabad">Hyderabad (Telangana)</option>
                            <option value="Pune">Pune (Maharashtra)</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block font-bold text-slate-700 uppercase mb-1.5">Password *</label>
                        <div class="relative">
                            <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
                            <input type="password" id="page-reg-password" required minlength="4" placeholder="Min 4 chars" class="w-full pl-10 pr-10 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-xs sm:text-sm">
                            <button type="button" onclick="togglePasswordVisibility('page-reg-password', 'page-reg-eye1')" class="absolute right-3.5 top-3.5 text-slate-400 hover:text-slate-600 cursor-pointer">
                                <i id="page-reg-eye1" class="fa-solid fa-eye text-xs"></i>
                            </button>
                        </div>
                    </div>
                    <div>
                        <label class="block font-bold text-slate-700 uppercase mb-1.5">Confirm Password *</label>
                        <div class="relative">
                            <i class="fa-solid fa-shield-halved absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
                            <input type="password" id="page-reg-confirm" required minlength="4" placeholder="Repeat password" class="w-full pl-10 pr-10 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-emerald-500 text-xs sm:text-sm">
                            <button type="button" onclick="togglePasswordVisibility('page-reg-confirm', 'page-reg-eye2')" class="absolute right-3.5 top-3.5 text-slate-400 hover:text-slate-600 cursor-pointer">
                                <i id="page-reg-eye2" class="fa-solid fa-eye text-xs"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <div class="pt-1">
                    <label class="flex items-start gap-2 text-slate-600 cursor-pointer">
                        <input type="checkbox" id="page-reg-terms" checked required class="mt-0.5 rounded border-slate-300 text-emerald-600 focus:ring-emerald-500">
                        <span class="text-[11px] leading-relaxed">I agree to CarePulse terms of universal service and acknowledge the <a href="/privacy-center" class="text-sky-600 hover:underline">Consent &amp; Privacy Policy</a>.</span>
                    </label>
                </div>

                <button type="submit" id="page-reg-submit-btn" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md transition flex items-center justify-center gap-2 cursor-pointer mt-2 text-xs sm:text-sm active:scale-95">
                    <i class="fa-solid fa-user-plus text-xs"></i>
                    <span>Create Account &amp; Register</span>
                </button>
            </form>

            <!-- Switch to Login -->
            <div class="mt-6 pt-5 border-t border-slate-100 text-center text-xs text-slate-500">
                <span>Already have a CarePulse account?</span>
                <a href="/login" class="text-sky-600 hover:text-sky-700 hover:underline font-bold ml-1 inline-flex items-center gap-1">
                    <span>Log In to your Account</span>
                    <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{layout/main :: footer}"></div>

    <script>
        function showPageRegAlert(message, type) {
            const alertBox = document.getElementById('page-reg-alert');
            if (!alertBox) return;
            let iconClass = 'fa-solid fa-circle-exclamation';
            let colorClasses = 'bg-red-50 text-red-700 border border-red-200';
            if (type === 'success') {
                iconClass = 'fa-solid fa-circle-check text-emerald-600';
                colorClasses = 'bg-emerald-50 text-emerald-800 border border-emerald-200';
            }
            alertBox.className = `mb-4 p-3 rounded-xl text-xs font-semibold flex items-center gap-2 ${colorClasses}`;
            alertBox.innerHTML = `<i class="${iconClass}"></i><span>${message}</span>`;
        }

        async function handlePageRegister(event) {
            if (event) event.preventDefault();
            const nameInput = document.getElementById('page-reg-fullname');
            const emailInput = document.getElementById('page-reg-email');
            const phoneInput = document.getElementById('page-reg-phone');
            const cityInput = document.getElementById('page-reg-city');
            const passInput = document.getElementById('page-reg-password');
            const confirmInput = document.getElementById('page-reg-confirm');
            const submitBtn = document.getElementById('page-reg-submit-btn');

            const fullName = nameInput ? nameInput.value.trim() : '';
            const email = emailInput ? emailInput.value.trim() : '';
            const phone = phoneInput ? phoneInput.value.trim() : '';
            const city = cityInput ? cityInput.value : 'Kolkata';
            const password = passInput ? passInput.value : '';
            const confirm = confirmInput ? confirmInput.value : '';

            if (!fullName) {
                showPageRegAlert('Please enter your full name.', 'error');
                return;
            }
            if (!email) {
                showPageRegAlert('Please enter your email address.', 'error');
                return;
            }
            if (!password || password.length < 4) {
                showPageRegAlert('Password must be at least 4 characters long.', 'error');
                return;
            }
            if (password !== confirm) {
                showPageRegAlert('Passwords do not match. Please re-enter identical passwords.', 'error');
                return;
            }

            const origHtml = submitBtn ? submitBtn.innerHTML : '';
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Creating Account...</span>';
            }

            try {
                const resp = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ fullName, email, phone, city, password })
                });

                const data = await resp.json();
                if (resp.ok && data.success) {
                    showPageRegAlert(data.message || 'Account created successfully! Redirecting...', 'success');
                    localStorage.setItem('auth_user_name', data.name || fullName);
                    if (data.uid) sessionStorage.setItem('firebase_session_synced', data.uid);
                    setTimeout(() => { window.location.href = '/'; }, 600);
                } else {
                    showPageRegAlert(data.message || 'Registration failed. Please review your details.', 'error');
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = origHtml;
                    }
                }
            } catch (err) {
                console.error(err);
                showPageRegAlert('Network error during registration. Please retry.', 'error');
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = origHtml;
                }
            }
        }
    </script>
</body>
</html>
