<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/main :: head}">
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">
    <!-- Header & Navigation -->
    <div th:replace="~{layout/main :: header}"></div>
    <div th:replace="~{layout/main :: nav}"></div>

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-200 p-7 sm:p-9 relative">
            
            <!-- Logo & Brand Header -->
            <div class="text-center mb-6">
                <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-sky-600 to-teal-500 text-white flex items-center justify-center mx-auto mb-3 text-2xl shadow-lg shadow-sky-500/20">
                    <i class="fa-solid fa-heart-pulse"></i>
                </div>
                <h1 class="text-2xl font-black text-slate-900 tracking-tight">Log In to CarePulse</h1>
                <p class="text-xs text-slate-500 mt-1">Access your universal healthcare records, appointments & prescriptions</p>
            </div>

            <!-- Inline Alert Box -->
            <div id="page-login-alert" class="hidden mb-4 p-3 rounded-xl text-xs font-semibold flex items-center gap-2"></div>

            <!-- 1. Google 1-Click Sign-In -->
            <div class="mb-3">
                <button type="button" onclick="signInWithGoogle()" class="w-full flex items-center justify-center gap-3 bg-white hover:bg-slate-50 text-slate-700 font-bold py-3 px-4 rounded-2xl border border-slate-300 shadow-sm transition hover:border-slate-400 cursor-pointer text-sm">
                    <svg class="w-5 h-5 flex-shrink-0" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Continue with Google</span>
                </button>
            </div>

            <!-- Instant 1-Tap Login -->
            <div class="mb-4">
                <button type="button" onclick="quickFillDemoLogin()" class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 text-white font-bold py-2.5 px-4 rounded-2xl shadow-md shadow-emerald-600/20 text-xs sm:text-sm transition cursor-pointer active:scale-95">
                    <i class="fa-solid fa-bolt text-amber-300"></i>
                    <span>1-Tap Instant Sign-In (Arindam Sahoo)</span>
                </button>
            </div>

            <!-- Divider -->
            <div class="relative flex py-1 items-center mb-5">
                <div class="flex-grow border-t border-slate-200"></div>
                <span class="flex-shrink mx-3 text-[10px] font-bold uppercase tracking-wider text-slate-400">or with email &amp; password</span>
                <div class="flex-grow border-t border-slate-200"></div>
            </div>

            <!-- Log In Form -->
            <form id="page-login-form" onsubmit="handlePageLogin(event)" class="space-y-4 text-xs">
                <div>
                    <label class="block font-bold text-slate-700 uppercase mb-1.5">Email Address or Username *</label>
                    <div class="relative">
                        <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
                        <input type="text" id="page-login-identifier" required placeholder="name@example.com" class="w-full pl-10 pr-3 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 text-xs sm:text-sm">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block font-bold text-slate-700 uppercase">Password *</label>
                    </div>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
                        <input type="password" id="page-login-password" required placeholder="Enter your password" class="w-full pl-10 pr-10 py-3 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-sky-500 text-xs sm:text-sm">
                        <button type="button" onclick="togglePasswordVisibility('page-login-password', 'page-login-eye')" class="absolute right-3.5 top-3.5 text-slate-400 hover:text-slate-600 cursor-pointer">
                            <i id="page-login-eye" class="fa-solid fa-eye text-xs"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between text-xs pt-1">
                    <label class="flex items-center gap-2 text-slate-600 cursor-pointer">
                        <input type="checkbox" id="remember-me" checked class="rounded border-slate-300 text-sky-600 focus:ring-sky-500">
                        <span>Remember my session</span>
                    </label>
                    <a href="/ai-assistant" class="text-sky-600 hover:underline font-medium">Need clinical help?</a>
                </div>

                <button type="submit" id="page-login-submit-btn" class="w-full py-3 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl shadow-md transition flex items-center justify-center gap-2 cursor-pointer mt-2 text-xs sm:text-sm active:scale-95">
                    <span>Log In to CarePulse</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>
            </form>

            <!-- Switch to Register -->
            <div class="mt-6 pt-5 border-t border-slate-100 text-center text-xs text-slate-500">
                <span>Don't have a CarePulse account?</span>
                <a href="/register" class="text-sky-600 hover:text-sky-700 hover:underline font-bold ml-1 inline-flex items-center gap-1">
                    <span>Create Account / Register</span>
                    <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div th:replace="~{layout/main :: footer}"></div>

    <script>
        function showPageLoginAlert(message, type) {
            const alertBox = document.getElementById('page-login-alert');
            if (!alertBox) return;
            let iconClass = 'fa-solid fa-circle-exclamation';
            let colorClasses = 'bg-red-50 text-red-700 border border-red-200';
            if (type === 'success') {
                iconClass = 'fa-solid fa-circle-check text-emerald-600';
                colorClasses = 'bg-emerald-50 text-emerald-800 border border-emerald-200';
            }
            alertBox.className = `mb-4 p-3 rounded-xl text-xs font-semibold flex items-center gap-2 ${colorClasses}`;
            alertBox.innerHTML = `<i class="${iconClass}"></i><span>${message}</span>`;
        }

        function quickFillDemoLogin() {
            const loginInput = document.getElementById('page-login-identifier');
            const passInput = document.getElementById('page-login-password');
            if (loginInput) loginInput.value = 'arindam.sahoo@gmail.com';
            if (passInput) passInput.value = 'arindam123';
            handlePageLogin();
        }

        async function handlePageLogin(event) {
            if (event && event.preventDefault) event.preventDefault();
            const loginInput = document.getElementById('page-login-identifier');
            const passInput = document.getElementById('page-login-password');
            const submitBtn = document.getElementById('page-login-submit-btn');

            const identifier = loginInput ? loginInput.value.trim() : '';
            const password = passInput ? passInput.value : '';

            if (!identifier || !password) {
                showPageLoginAlert('Please enter both your email/username and password.', 'error');
                return;
            }

            const origHtml = submitBtn ? submitBtn.innerHTML : '';
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>Logging In...</span>';
            }

            try {
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ emailOrUsername: identifier, password: password })
                });

                const data = await resp.json();
                if (resp.ok && data.success) {
                    showPageLoginAlert(data.message || 'Login successful! Redirecting to Dashboard...', 'success');
                    localStorage.setItem('auth_user_name', data.name || 'User');
                    if (data.uid) sessionStorage.setItem('firebase_session_synced', data.uid);
                    setTimeout(() => { window.location.href = '/'; }, 500);
                } else {
                    showPageLoginAlert(data.message || 'Login failed. Please check credentials.', 'error');
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = origHtml;
                    }
                }
            } catch (err) {
                console.error(err);
                showPageLoginAlert('Network error occurred during login. Please retry.', 'error');
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = origHtml;
                }
            }
        }
    </script>
</body>
</html>
